name: Windows 11 Edge download and SmartScreen observation
on:
  push:
    branches: [codex/windows-qa-smartscreen-1-1-1]
permissions: {}
jobs:
  edge-windows-verdict:
    runs-on: windows-11-arm
    timeout-minutes: 9
    steps:
      - name: Observe exact Edge download and normal Windows open
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'MEW-EDIT-Setup-1.1.1.exe'
          $digest = '2B6B2A186A541E4B2163EBDB3003E70C0580F0D7D8096B45340D75FD575313AA'
          $url = "https://github.com/mewakinHub/mew-edit-download/releases/download/v1.1.1/$name"
          $hostOs = Get-CimInstance Win32_OperatingSystem
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($hostOs.Caption -notmatch 'Windows 11' -or $arch -ne 'Arm64') { throw 'Unexpected runner OS or architecture.' }
          Write-Output "Windows 11 build $($hostOs.BuildNumber), native $arch; x64 EXE test."
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path $edge)) { $edge = Join-Path $env:ProgramFiles 'Microsoft/Edge/Application/msedge.exe' }
          if (-not (Test-Path $edge)) { throw 'Stock Edge executable unavailable.' }
          $shell = New-Object -ComObject Shell.Application
          $downloads = $shell.NameSpace('shell:Downloads').Self.Path
          $file = Join-Path $downloads $name
          if (Test-Path $file) { throw 'Download path is not empty.' }
          $edgeProfile = Join-Path $env:RUNNER_TEMP 'mew-edge-profile'
          Start-Process -FilePath $edge -ArgumentList @("--user-data-dir=`"$edgeProfile`"", '--no-first-run', $url)
          for ($i=0; $i -lt 180 -and -not (Test-Path $file); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $file)) { throw 'No completed exact Edge download; no warning bypass or alternative downloader attempted.' }
          if ((Get-Item $file).Length -ne 219414426 -or (Get-FileHash $file).Hash -ne $digest) { throw 'Unexpected exact file bytes.' }
          $motw = Get-Content -LiteralPath $file -Stream Zone.Identifier -Raw
          if ($motw -notmatch '(?m)^ZoneId=3\s*$') { throw 'Download does not carry Internet-zone Mark-of-the-Web.' }
          Write-Output 'PASS Edge download; exact SHA-256 and Zone.Identifier ZoneId=3.'
          if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count) { throw 'Firewall profiles are not enabled.' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $uia = [Windows.Automation.AutomationElement]::RootElement
          $rules = @()
          try {
            foreach ($program in @($file, (Join-Path $env:LOCALAPPDATA 'Programs/MEW EDIT/MEW EDIT.exe'), (Join-Path $env:LOCALAPPDATA 'Programs/mew-edit/MEW EDIT.exe'))) {
              $rules += New-NetFirewallRule -DisplayName 'MEW QA egress block' -Direction Outbound -Action Block -Program $program -Profile Any
            }
            try { Start-Process -FilePath $file -Verb Open }
            catch { Write-Output "Windows refused the normal Open request (HRESULT $($_.Exception.HResult)); observing any remaining dialog." }
            $mark = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Text)
            for ($i=0; $i -lt 80; $i++) {
              foreach ($window in $uia.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)) {
                try {
                  $title = $window.Current.Name
                  if ($window.Current.IsOffscreen) { continue }
                  if ($title -match 'SmartScreen|Windows protected your PC') {
                    Write-Output 'OBSERVED Windows SmartScreen prompt. No controls invoked.'
                    return
                  }
                  if ($title -match '^MEW EDIT(?: Setup)?\s*$') {
                    Write-Output "OBSERVED $title after normal Windows Open; no SmartScreen prompt was observed."
                    return
                  }
                  if ($title -match 'Microsoft account|Downloads|Edge|Explorer|Windows PowerShell') { continue }
                  foreach ($label in $window.FindAll([Windows.Automation.TreeScope]::Descendants,$mark)) {
                    if ($label.Current.Name -match 'Windows protected your PC|Microsoft Defender SmartScreen|SmartScreen can.t be reached') {
                      Write-Output 'OBSERVED Windows SmartScreen verdict dialog. No controls invoked.'
                      return
                    }
                  }
                } catch [Windows.Automation.ElementNotAvailableException] {}
              }
              Start-Sleep -Milliseconds 500
            }
            throw 'No observable Windows stock-open verdict (neither SmartScreen nor MEW setup window).'
          } finally {
            Get-Process 'MEW EDIT','MEW-EDIT-Setup-1.1.1' -ErrorAction SilentlyContinue | Stop-Process -Force
            $rules | Remove-NetFirewallRule
          }
