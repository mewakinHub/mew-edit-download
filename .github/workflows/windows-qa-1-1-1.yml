name: Isolated Windows GUI installer QA
on:
  push:
    branches: [codex/windows-qa-gui-1-1-1]
permissions: {}
jobs:
  stock-installer:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download exact published prerelease installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:RUNNER_TEMP 'MEW-EDIT-Setup-1.1.1.exe'
          $url = 'https://github.com/mewakinHub/mew-edit-download/releases/download/v1.1.1/MEW-EDIT-Setup-1.1.1.exe'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/mewakinHub/mew-edit-download/releases/454466797'
          $asset = @($release.assets | Where-Object id -eq 779155288)
          if ($release.draft -or -not $release.prerelease -or $release.tag_name -ne 'v1.1.1' -or $asset.Count -ne 1 -or $asset[0].browser_download_url -ne $url -or $asset[0].size -ne 219414426 -or $asset[0].digest -ne 'sha256:2b6b2a186a541e4b2163ebdb3003e70c0580f0d7d8096b45340d75fd575313aa') { throw 'Unexpected prerelease metadata.' }
          Invoke-WebRequest -Uri $url -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 219414426) { throw 'Unexpected asset size.' }
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne '2B6B2A186A541E4B2163EBDB3003E70C0580F0D7D8096B45340D75FD575313AA') { throw 'Unexpected asset digest.' }
          Write-Output 'Exact approved installer digest and size verified.'
      - name: Observe non-silent setup and first window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:RUNNER_TEMP 'MEW-EDIT-Setup-1.1.1.exe'
          $target = Join-Path $env:LOCALAPPDATA 'MEW-EDIT-QA'
          $exe = Join-Path $target 'MEW EDIT.exe'
          if (@(Get-NetFirewallProfile | Where-Object { -not $_.Enabled }).Count) { throw 'Firewall profiles are not enabled.' }
          $rules = @()
          try {
            foreach ($program in @($file, $exe)) {
              $rules += New-NetFirewallRule -DisplayName "MEW stock QA isolated process" -Direction Outbound -Action Block -Program $program -Profile Any
            }
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $root = [Windows.Automation.AutomationElement]::RootElement
            $safe = [Windows.Automation.TreeScope]::Descendants
            $install = Start-Process -FilePath $file -ArgumentList @("/D=$target") -PassThru
            $seen = $false
            for ($i=0; $i -lt 360; $i++) {
              $install.Refresh()
              if ($install.HasExited) { break }
              try {
                $query = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$install.Id)
                $window = $root.FindFirst([Windows.Automation.TreeScope]::Children,$query)
                if ($window -and -not $window.Current.IsOffscreen) {
                  if (-not $seen) {
                    $seen = $true
                    Write-Output "Observed setup window: $($window.Current.Name)"
                  }
                  $filter = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Button)
                  foreach ($button in $window.FindAll($safe,$filter)) {
                    $name = $button.Current.Name.Replace('&','').Trim()
                    if ($button.Current.IsEnabled -and -not $button.Current.IsOffscreen -and $name -match '^(Install|Next\s*>?|Finish|Close)$') {
                      $pattern = $null
                      if ($button.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)) {
                        Write-Output "Invoked setup control: $name"
                        $pattern.Invoke()
                        break
                      }
                    }
                  }
                }
              } catch [Windows.Automation.ElementNotAvailableException] {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $install.HasExited) { Stop-Process -Id $install.Id -Force; throw 'Timed out waiting for non-silent installer to finish.' }
            if (-not $seen) { throw 'No observable window for non-silent NSIS in the runner desktop.' }
            if ($install.ExitCode -ne 0) { throw "NSIS exit $($install.ExitCode)" }
            if (-not (Test-Path -LiteralPath $exe)) { throw 'Installed executable missing from isolated destination.' }
            $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
            if ($version -notmatch '^1\.1\.1(?:\.0)?$') { throw "Unexpected installed product version $version" }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $target 'resources/app.asar')).Hash -ne '8BDFE6A50DCB569A72D9AA5C4E21B1D138297E2BFD0C1A4DDC38231591718CE5') { throw 'Installed ASAR digest mismatch.' }
            Write-Output "PASS NSIS non-silent install, installed EXE version $version and exact ASAR digest on Windows Server 2025 x64."
            $app = Get-Process 'MEW EDIT' -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -NE 0 | Select-Object -First 1
            if (-not $app) { $app = Start-Process -FilePath $exe -ArgumentList '--disable-background-networking','--disable-component-update' -PassThru }
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "App exited before first window with code $($app.ExitCode)." }
              if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -match 'MEW') {
                Write-Output 'PASS observed initial MEW EDIT window; no licence or live-service actions.'
                return
              }
            }
            throw 'No initial MEW EDIT window observed within 45 seconds.'
          } finally {
            Get-Process 'MEW EDIT' -ErrorAction SilentlyContinue | Stop-Process -Force
            $rules | Remove-NetFirewallRule
          }
